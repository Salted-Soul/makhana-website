<!DOCTYPE html>
<html>

<head>

    <title>My Wishlist</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <h1 style="text-align:center;margin-top:40px;">My Wishlist</h1>

    <section class="products">

        <div class="product-container" id="wishlist-items">

        </div>

    </section>
<script src="js/config.js"></script>
    <script src="js/script.js"></script>

<script>

async function renderWishlist() {

    try {

        const container =
            document.getElementById(
                "wishlist-items"
            );

        if (!container) return;

        container.innerHTML =
            "<h3>Loading...</h3>";

        const response =
    await fetch(
        `${API_BASE}/wishlist`,

                {
                    credentials:
                        "include"
                }
            );

        const data =
            await response.json();

        if (
            !data.success
        ) {

            container.innerHTML =

                "<h3>Failed to load wishlist</h3>";

            return;
        }

        const products =
            data.wishlist.products || [];

        if (
            products.length === 0
        ) {

            container.innerHTML = `

                <div style="
                    text-align:center;
                    padding:40px;
                ">

                    <h2>
                        ❤️ Wishlist Empty
                    </h2>

                    <p>
                        Start adding products
                    </p>

                </div>
            `;

            return;
        }

        let html = "";

        products.forEach(
            product => {

                html += `

                <div class="card">

                    <button
                        class="wishlist-btn"
                        onclick="
                            removeFromWishlist(
                                '${product._id}'
                            )
                        "
                    >
                        <i
                            class="
                            fa-solid
                            fa-heart
                            "
                            style="
                            color:red
                            "
                        ></i>
                    </button>

                    <img
                        src="${
                            product.thumbnail ||

                            product.images?.[0] ||

                            ''
                        }"
                    >

                    <h3>
                        ${product.name}
                    </h3>

                    <p class="price">
                        ₹${product.price}
                    </p>

                    <button
    onclick="addToCart(
        this,
        '${product._id}',
        '${product.name}',
        ${product.price},
        '${product.thumbnail || product.images?.[0] || ""}'
    )"
>
    Add To Cart
</button>

                </div>
                `;
            }
        );

        container.innerHTML =
            html;

    } catch (err) {

        console.error(err);

        document.getElementById(
            "wishlist-items"
        ).innerHTML =

            "<h3>Error loading wishlist</h3>";
    }
}


// ======================================
// REMOVE FROM WISHLIST
// ======================================

async function removeFromWishlist(
    productId
) {

    try {

        const response =
    await fetch(
        `${API_BASE}/wishlist/remove/${productId}`,
                {

                    method:
                        "DELETE",

                    credentials:
                        "include"
                }
            );

        const data =
            await response.json();

        if (
            data.success
        ) {

            notify("Removed from wishlist ❌");

            renderWishlist();

        } else {

            notify("Failed to remove");
        }

    } catch (err) {

        console.error(err);

        notify("Remove failed");
    }
}


window.addEventListener(

    "DOMContentLoaded",

    () => {

        renderWishlist();

        updateWishlistCount();
    }
);

</script>

console.log("API_BASE =", API_BASE);
</body>

</html>
